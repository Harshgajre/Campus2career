<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 260">
  <defs>
    <!-- Text Gradients -->
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <!-- Bridge Gradient -->
    <linearGradient id="c" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <!-- Glow Filter for Moving Dot -->
    <filter id="dot-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Left: Campus Text & Icon -->
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800">
    <path fill="#2563eb" d="M70 75h44L92 62l-22 13zm8 2v20c8 8 20 8 28 0V77z"/>
    <text x="20" y="174" font-size="72" fill="url(#a)">Campus</text>
  </g>

  <!-- Right: Career Text & Icon -->
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800">
    <path fill="#10b981" d="M910 63h60v43h-60zM924 63v-8c0-10 32-10 32 0v8h-8v-7c0-3-16-3-16 0v7z"/>
    <text x="830" y="174" font-size="72" fill="url(#b)">Career</text>
  </g>

  <!-- Center: Bridge Structure -->
  <g fill="none" stroke="url(#c)" stroke-linecap="round">
    <!-- Main Suspension Arch Cable -->
    <path d="M370 170Q550 20 730 170" stroke-width="13"/>
    <!-- Secondary Arch Cable -->
    <path d="M370 170Q550 62 730 170" stroke-width="5"/>
    <!-- Horizontal Bridge Deck Roadway -->
    <path d="M370 170H730" stroke-width="5" opacity="0.6"/>
    <!-- Vertical Suspender Cables -->
    <path d="M406 137V170 M442 108V170 M478 83V170 M514 68V170 M550 62V170 M586 68V170 M622 83V170 M658 108V170 M694 137V170" stroke-width="4"/>
  </g>

  <!-- Subtitle Arrow Indicator -->
  <text x="550" y="222" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#64748b">&#8596;</text>

  <!-- Animated Glowing Moving Dot (Traversing the Bridge Arch) -->
  <g>
    <!-- Outer Glowing Pulse Aura -->
    <circle r="11" fill="#38bdf8" opacity="0.85" filter="url(#dot-glow)">
      <animateMotion
        path="M370 170Q550 20 730 170"
        dur="3.2s"
        repeatCount="indefinite"
        keyPoints="0;1;0"
        keyTimes="0;0.5;1"
        calcMode="spline"
        keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"
      />
    </circle>
    <!-- Inner Core Bright White Dot -->
    <circle r="5" fill="#ffffff">
      <animateMotion
        path="M370 170Q550 20 730 170"
        dur="3.2s"
        repeatCount="indefinite"
        keyPoints="0;1;0"
        keyTimes="0;0.5;1"
        calcMode="spline"
        keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"
      />
    </circle>
  </g>
</svg>